apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-labelled-client
  namespace: policy-smoke
spec:
  podSelector:
    matchLabels:
      app: policy-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: policy-client
      ports:
        - protocol: TCP
          port: 8080

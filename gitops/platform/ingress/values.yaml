traefik:
  deployment:
    replicas: 1
    revisionHistoryLimit: 3
    terminationGracePeriodSeconds: 30

  global:
    checkNewVersion: false
    sendAnonymousUsage: false

  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      enabled: true
      ingressClass: traefik
      namespaces:
        - ingress-system
        - apps
        - observability
      publishedService:
        enabled: true
    kubernetesGateway:
      enabled: false

  gateway:
    enabled: false
  gatewayClass:
    enabled: false

  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik

  ingressRoute:
    dashboard:
      enabled: false

  service:
    spec:
      type: NodePort
      externalTrafficPolicy: Local

  ports:
    web:
      port: 8000
      expose:
        default: true
      exposedPort: 80
      nodePort: 30080
      protocol: TCP
    websecure:
      port: 8443
      expose:
        default: true
      exposedPort: 443
      nodePort: 30443
      protocol: TCP

  log:
    level: INFO
    format: json
  accessLog:
    enabled: true
    format: json
    bufferingSize: 20

  metrics:
    addInternals: true
    prometheus:
      addRoutersLabels: true
      service:
        enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
